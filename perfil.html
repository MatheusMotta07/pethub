<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <title>Meu perfil · PetHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;600;700;800&family=Work+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" />
  <link rel="stylesheet" href="css/style.css?v=6" />
</head>
<body>
  <header class="topbar" id="navbar"></header>

  <main>
    <div class="page-header">
      <h1>Meu perfil</h1>
      <p>Seus dados e, se você for tutor, o perfil dos seus pets.</p>
    </div>

    <div class="card" style="margin-bottom:20px;">
      <h3>Dados pessoais</h3>
      <form id="form-perfil">
        <div class="field-row">
          <div>
            <label for="p-nome">Nome</label>
            <input type="text" id="p-nome" required />
          </div>
          <div>
            <label for="p-telefone">Telefone</label>
            <input type="tel" id="p-telefone" />
          </div>
        </div>
        <label for="p-bairro">Bairro</label>
        <input type="text" id="p-bairro" required />
        <button type="submit" class="btn btn-primary" style="margin-top:12px;">Salvar</button>
      </form>
    </div>

    <div class="card" id="box-negocio" style="display:none; margin-bottom:20px;">
      <h3>Dados do negócio</h3>
      <form id="form-negocio">
        <label for="n-fantasia">Nome fantasia</label>
        <input type="text" id="n-fantasia" required />
        <label for="n-descricao">Descrição</label>
        <textarea id="n-descricao"></textarea>
        <p class="center-note" id="status-verificacao"></p>
        <button type="submit" class="btn btn-primary" style="margin-top:12px;">Salvar</button>
      </form>
    </div>

    <div class="card" id="box-pets" style="display:none;">
      <h3>Meus pets</h3>
      <div id="lista-pets"></div>

      <hr style="border-color:#f5e9d6; margin:16px 0;" />
      <h4>Adicionar pet</h4>
      <form id="form-pet">
        <div class="field-row">
          <div>
            <label for="pet-nome">Nome</label>
            <input type="text" id="pet-nome" required />
          </div>
          <div>
            <label for="pet-especie">Espécie</label>
            <select id="pet-especie">
              <option value="cachorro">Cachorro</option>
              <option value="gato">Gato</option>
              <option value="outro">Outro</option>
            </select>
          </div>
        </div>
        <div class="field-row">
          <div>
            <label for="pet-raca">Raça</label>
            <input type="text" id="pet-raca" />
          </div>
          <div>
            <label for="pet-nascimento">Data de nascimento</label>
            <input type="date" id="pet-nascimento" />
          </div>
        </div>
        <label for="pet-vacinas">Vacinas</label>
        <textarea id="pet-vacinas" placeholder="Ex: V10 em 10/2026, antirrábica em 11/2026"></textarea>
        <label for="pet-alergias">Alergias</label>
        <textarea id="pet-alergias" placeholder="Ex: alergia a frango"></textarea>
        <label for="pet-rotina">Rotina</label>
        <textarea id="pet-rotina" placeholder="Ex: passeio 2x ao dia, ração às 8h e 18h"></textarea>
        <label for="pet-foto">Foto (opcional)</label>
        <input type="file" id="pet-foto" accept="image/*" />
        <button type="submit" class="btn btn-primary btn-block" style="margin-top:12px;">Adicionar pet</button>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/app.js?v=4"></script>
  <script>
    renderNavbar("perfil");
    let profile = null;
    let parceiro = null;

    async function init() {
      profile = await requireAuth();
      if (!profile) return;

      document.getElementById("p-nome").value = profile.nome || "";
      document.getElementById("p-telefone").value = profile.telefone || "";
      document.getElementById("p-bairro").value = profile.bairro || "";

      if (profile.tipo === "tutor") {
        document.getElementById("box-pets").style.display = "block";
        carregarPets();
      } else {
        document.getElementById("box-negocio").style.display = "block";
        const { data } = await window.sb.from("parceiros").select("*").eq("profile_id", profile.id).maybeSingle();
        parceiro = data;
        if (parceiro) {
          document.getElementById("n-fantasia").value = parceiro.nome_fantasia || "";
          document.getElementById("n-descricao").value = parceiro.descricao || "";
          document.getElementById("status-verificacao").textContent = parceiro.verificado
            ? "Cadastro verificado (CNPJ/CRMV)."
            : "Cadastro em análise de verificação (CNPJ/CRMV).";
        }
      }
    }

    document.getElementById("form-perfil").addEventListener("submit", async (e) => {
      e.preventDefault();
      const { error } = await window.sb.from("profiles").update({
        nome: document.getElementById("p-nome").value.trim(),
        telefone: document.getElementById("p-telefone").value.trim(),
        bairro: document.getElementById("p-bairro").value.trim()
      }).eq("id", profile.id);
      if (error) {
        showToast("Erro ao salvar: " + error.message, "error");
        return;
      }
      showToast("Perfil atualizado!", "success");
    });

    document.getElementById("form-negocio").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!parceiro) return;
      const { error } = await window.sb.from("parceiros").update({
        nome_fantasia: document.getElementById("n-fantasia").value.trim(),
        descricao: document.getElementById("n-descricao").value.trim()
      }).eq("id", parceiro.id);
      if (error) {
        showToast("Erro ao salvar: " + error.message, "error");
        return;
      }
      showToast("Dados do negócio atualizados!", "success");
    });

    let editandoPetId = null;
    let petsCache = [];

    function avatarPet(pet) {
      return pet.foto_url
        ? `<img class="pet-avatar" src="${pet.foto_url}" alt="Foto de ${pet.nome}" />`
        : `<div class="pet-avatar pet-avatar-placeholder">${ICONS.paw}</div>`;
    }

    async function carregarPets() {
      const { data, error } = await window.sb.from("pets").select("*").eq("tutor_id", profile.id).order("created_at");
      const el = document.getElementById("lista-pets");
      petsCache = data || [];
      if (error || !petsCache.length) {
        el.innerHTML = `<p class="empty-state">Nenhum pet cadastrado ainda.</p>`;
        return;
      }

      el.innerHTML = petsCache.map((pet) => {
        if (editandoPetId === pet.id) {
          return `
            <div class="card pet-card-item" style="margin-bottom:10px;">
              <div style="display:flex; gap:12px; align-items:flex-start;">
                ${avatarPet(pet)}
                <div style="flex:1; min-width:0;">
                  <div class="field-row">
                    <div>
                      <label for="edit-nome-${pet.id}">Nome</label>
                      <input type="text" id="edit-nome-${pet.id}" value="${pet.nome}" />
                    </div>
                    <div>
                      <label for="edit-especie-${pet.id}">Espécie</label>
                      <select id="edit-especie-${pet.id}">
                        <option value="cachorro" ${pet.especie === "cachorro" ? "selected" : ""}>Cachorro</option>
                        <option value="gato" ${pet.especie === "gato" ? "selected" : ""}>Gato</option>
                        <option value="outro" ${pet.especie === "outro" ? "selected" : ""}>Outro</option>
                      </select>
                    </div>
                  </div>
                  <div class="field-row">
                    <div>
                      <label for="edit-raca-${pet.id}">Raça</label>
                      <input type="text" id="edit-raca-${pet.id}" value="${pet.raca || ""}" />
                    </div>
                    <div>
                      <label for="edit-nascimento-${pet.id}">Data de nascimento</label>
                      <input type="date" id="edit-nascimento-${pet.id}" value="${pet.data_nascimento || ""}" />
                    </div>
                  </div>
                  <label for="edit-vacinas-${pet.id}">Vacinas</label>
                  <textarea id="edit-vacinas-${pet.id}" placeholder="Ex: V10 em 10/2026, antirrábica em 11/2026">${pet.vacinas || ""}</textarea>
                  <label for="edit-alergias-${pet.id}">Alergias</label>
                  <textarea id="edit-alergias-${pet.id}" placeholder="Ex: alergia a frango">${pet.alergias || ""}</textarea>
                  <label for="edit-rotina-${pet.id}">Rotina</label>
                  <textarea id="edit-rotina-${pet.id}" placeholder="Ex: passeio 2x ao dia, ração às 8h e 18h">${pet.rotina || ""}</textarea>
                  <label for="edit-foto-${pet.id}">Trocar foto (opcional)</label>
                  <input type="file" id="edit-foto-${pet.id}" accept="image/*" />
                  <div style="display:flex; gap:6px; margin-top:10px;">
                    <button class="btn btn-primary btn-salvar-edicao" data-id="${pet.id}">Salvar</button>
                    <button class="btn btn-ghost btn-cancelar-edicao">Cancelar</button>
                  </div>
                </div>
              </div>
            </div>
          `;
        }
        return `
          <div class="card pet-card-item" style="margin-bottom:10px;">
            <div style="display:flex; gap:12px;">
              ${avatarPet(pet)}
              <div style="flex:1; min-width:0;">
                <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:8px; flex-wrap:wrap;">
                  <h4 style="margin:0 0 4px;">${pet.nome} <span class="badge">${pet.especie}</span></h4>
                  <div style="display:flex; gap:6px; flex-shrink:0;">
                    <button class="btn btn-secondary btn-editar-pet" data-id="${pet.id}">Editar</button>
                    <button class="btn btn-danger btn-excluir-pet" data-id="${pet.id}">Excluir</button>
                  </div>
                </div>
                <p style="margin:0; font-size:0.85rem; color:var(--ink-soft);">${pet.raca || ""} ${pet.data_nascimento ? "· nasc. " + formatDate(pet.data_nascimento) : ""}</p>
                ${pet.vacinas ? `<p style="margin:6px 0 0; font-size:0.85rem;"><strong>Vacinas:</strong> ${pet.vacinas}</p>` : ""}
                ${pet.alergias ? `<p style="margin:2px 0 0; font-size:0.85rem;"><strong>Alergias:</strong> ${pet.alergias}</p>` : ""}
                ${pet.rotina ? `<p style="margin:2px 0 0; font-size:0.85rem;"><strong>Rotina:</strong> ${pet.rotina}</p>` : ""}
              </div>
            </div>
          </div>
        `;
      }).join("");

      document.querySelectorAll(".btn-excluir-pet").forEach((btn) => {
        btn.addEventListener("click", async () => {
          if (!confirm("Excluir este pet?")) return;
          await window.sb.from("pets").delete().eq("id", btn.dataset.id);
          carregarPets();
        });
      });
      document.querySelectorAll(".btn-editar-pet").forEach((btn) => {
        btn.addEventListener("click", () => {
          editandoPetId = btn.dataset.id;
          carregarPets();
        });
      });
      document.querySelectorAll(".btn-cancelar-edicao").forEach((btn) => {
        btn.addEventListener("click", () => {
          editandoPetId = null;
          carregarPets();
        });
      });
      document.querySelectorAll(".btn-salvar-edicao").forEach((btn) => {
        btn.addEventListener("click", () => salvarEdicaoPet(btn.dataset.id));
      });
    }

    // Envia a foto do pet pro bucket "pet-fotos" (caminho <tutor_id>/<pet_id>-<timestamp>.ext,
    // sempre um nome novo) e devolve a URL pública. A foto antiga fica órfã no bucket,
    // aceitável para este protótipo.
    async function uploadFotoPet(file, petId) {
      const ext = (file.name.split(".").pop() || "jpg").toLowerCase();
      const caminho = `${profile.id}/${petId}-${Date.now()}.${ext}`;
      const { error } = await window.sb.storage.from("pet-fotos").upload(caminho, file, {
        contentType: file.type || "image/jpeg"
      });
      if (error) throw error;
      const { data } = window.sb.storage.from("pet-fotos").getPublicUrl(caminho);
      return data.publicUrl;
    }

    async function salvarEdicaoPet(petId) {
      const nome = document.getElementById(`edit-nome-${petId}`).value.trim();
      if (!nome) {
        showToast("Informe o nome do pet.", "error");
        return;
      }
      const payload = {
        nome,
        especie: document.getElementById(`edit-especie-${petId}`).value,
        raca: document.getElementById(`edit-raca-${petId}`).value.trim(),
        data_nascimento: document.getElementById(`edit-nascimento-${petId}`).value || null,
        vacinas: document.getElementById(`edit-vacinas-${petId}`).value.trim(),
        alergias: document.getElementById(`edit-alergias-${petId}`).value.trim(),
        rotina: document.getElementById(`edit-rotina-${petId}`).value.trim()
      };

      const fileInput = document.getElementById(`edit-foto-${petId}`);
      const file = fileInput.files[0];

      if (file) {
        try {
          payload.foto_url = await uploadFotoPet(file, petId);
        } catch (err) {
          showToast("Erro ao enviar foto: " + err.message, "error");
          return;
        }
      }

      const { error } = await window.sb.from("pets").update(payload).eq("id", petId);
      if (error) {
        showToast("Erro ao salvar: " + error.message, "error");
        return;
      }
      showToast("Pet atualizado!", "success");
      editandoPetId = null;
      carregarPets();
    }

    document.getElementById("form-pet").addEventListener("submit", async (e) => {
      e.preventDefault();
      const payload = {
        tutor_id: profile.id,
        nome: document.getElementById("pet-nome").value.trim(),
        especie: document.getElementById("pet-especie").value,
        raca: document.getElementById("pet-raca").value.trim(),
        data_nascimento: document.getElementById("pet-nascimento").value || null,
        vacinas: document.getElementById("pet-vacinas").value.trim(),
        alergias: document.getElementById("pet-alergias").value.trim(),
        rotina: document.getElementById("pet-rotina").value.trim()
      };
      const { data: novoPet, error } = await window.sb.from("pets").insert(payload).select().single();
      if (error) {
        showToast("Erro ao adicionar pet: " + error.message, "error");
        return;
      }

      const file = document.getElementById("pet-foto").files[0];
      if (file) {
        try {
          const fotoUrl = await uploadFotoPet(file, novoPet.id);
          await window.sb.from("pets").update({ foto_url: fotoUrl }).eq("id", novoPet.id);
        } catch (err) {
          showToast("Pet cadastrado, mas a foto não pôde ser enviada: " + err.message, "error");
          e.target.reset();
          carregarPets();
          return;
        }
      }

      showToast("Pet cadastrado!", "success");
      e.target.reset();
      carregarPets();
    });

    init();
  </script>
</body>
</html>
